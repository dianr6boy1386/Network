{% extends "network/layout.html" %}

{% block title %}Register · Network{% endblock %}

{% block body %}

    <h2>Register</h2>

    {% if message %}
        <div class="alert alert-danger" role="alert">{{ message }}</div>
    {% endif %}

    <form action="{% url 'register' %}" method="post">
        {% csrf_token %}
        <div class="form-group">
            <input class="form-control" autofocus type="text" name="username" placeholder="Username" aria-label="Username">
        </div>
        <div class="form-group">
            <input class="form-control" type="email" name="email" placeholder="Email Address" aria-label="Email address">
        </div>
        <div class="form-group">
            <input class="form-control" type="password" name="password" placeholder="Password" aria-label="Password">
        </div>
        <div class="form-group">
            <input class="form-control" type="password" name="confirmation" placeholder="Confirm Password" aria-label="Confirm password">
        </div>
        <input class="btn btn-primary" type="submit" value="Register">
    </form>

    <p class="mt-3">Already have an account? <a href="{% url 'login' %}">Log In here.</a></p>

{% endblock %}
