{% extends "network/layout.html" %}

{% block title %}Log In · Network{% endblock %}

{% block body %}

    <h2>Login</h2>

    {% if message %}
        <div class="alert alert-danger" role="alert">{{ message }}</div>
    {% endif %}

    <form action="{% url 'login' %}" method="post">
        {% csrf_token %}
        {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
        <div class="form-group">
            <input autofocus class="form-control" type="text" name="username" placeholder="Username" aria-label="Username">
        </div>
        <div class="form-group">
            <input class="form-control" type="password" name="password" placeholder="Password" aria-label="Password">
        </div>
        <input class="btn btn-primary" type="submit" value="Login">
    </form>

    <p class="mt-3">Don't have an account? <a href="{% url 'register' %}">Register here.</a></p>

{% endblock %}
